line-length    = 88
target-version = "py310"

[lint]
    ignore  = ["COM", "D203", "D211", "D213", "PLR0912"]
    select  = ["ALL"]
    exclude = ["utils/manual_verify_phase2.py", "utils/verify_env.py"]

    [lint.per-file-ignores]
        "utils/*.py" = ["S101", "T201", "INP001"]
        "tests/*" = ["S101", "T201"]

[format]
    docstring-code-format = true
